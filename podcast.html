<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Desapre(he)nder para CreSer · Podcast</title>

<style>

:root{
  --negro:#0b0b0c;
  --negro-profundo:#050505;
  --blanco:#ffffff;
  --gris-suave:#5e5e5e;
  --azul:#6f8f9f;
  --linea:rgba(0,0,0,.08);
  --yt:#FF0000;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
  background:var(--blanco);
  color:var(--negro-profundo);
}

.wrap{
  max-width:1100px;
  margin:0 auto;
  padding:0 32px;
}

/* HERO */

.hero{
  padding:96px 0 48px;
}

.back-link{
  display:inline-block;
  font-size:11px;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:rgba(0,0,0,.55);
  text-decoration:none;
  margin-bottom:36px;
}

.back-link::before{
  content:"← ";
}

.back-link:hover{
  color:var(--azul);
}

.kicker{
  font-size:12px;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:rgba(0,0,0,.45);
  margin-bottom:22px;
}

h1{
  font-size:clamp(38px,5vw,60px);
  margin:0 0 18px;
  font-weight:600;
}

.hero p{
  max-width:640px;
  font-size:18px;
  color:var(--gris-suave);
}

/* AXIOMA */

.axioma{
  background:var(--negro-profundo);
  color:var(--blanco);
  padding:52px 0;
  text-align:center;
}

.axioma p{
  margin:0;
  font-size:clamp(18px,2vw,22px);
  letter-spacing:.36em;
  text-transform:uppercase;
  color:#8fb0c2;
}

/* CLIPS */

.clips{
  padding:90px 0 60px;
}

.clips-grid{
  display:flex;
  justify-content:center;
  gap:40px;
  flex-wrap:wrap;
}

.clip{
  width:220px;
}

.clip video{
  width:100%;
  border-radius:14px;
  display:block;
}

/* YOUTUBE BUTTON */

.youtube-cta{
  text-align:center;
  padding:60px 0 90px;
}

.youtube-btn{
  display:inline-flex;
  align-items:center;
  gap:12px;
  padding:14px 22px;
  border-radius:999px;
  background:var(--yt);
  color:#fff;
  font-size:14px;
  letter-spacing:.18em;
  text-transform:uppercase;
  text-decoration:none;
  transition:.25s ease;
}

.youtube-btn svg{
  width:18px;
  height:18px;
  fill:#fff;
}

.youtube-btn:hover{
  background:#cc0000;
  transform:translateY(-2px);
}

/* BLOQUE FINAL */

.bloque{
  background:var(--negro-profundo);
  color:var(--blanco);
  padding:80px 0;
}

.bloque p{
  max-width:720px;
  margin:0 0 28px;
  font-size:clamp(22px,2.4vw,28px);
  line-height:1.45;
}

@media (max-width:500px){
  .clips-grid{
    flex-direction:column;
    align-items:center;
  }
}

</style>
</head>

<body>

<section class="hero">
  <div class="wrap">
    <a href="/" class="back-link">Volver al inicio</a>
    <div class="kicker">Podcast</div>
    <h1>Desapre(he)nder para CreSer</h1>
    <p>Conversaciones que cuestionan lo que creemos entender.</p>
  </div>
</section>

<section class="axioma">
  <div class="wrap">
    <p>No todo lo que duele es patología</p>
  </div>
</section>

<section class="clips">
  <div class="wrap clips-grid">

    <div class="clip">
      <video src="/assets/clip1.mp4"
      poster="/assets/poster1.jpg"
      controls
  playsinline
  preload="metadata">
</video>
    <div class="clip">
      <video src="/assets/clip2.mp4" poster="/assets/poster2.jpg" playsinline preload="metadata"></video>
    </div>

    <div class="clip">
      <video src="/assets/clip3.mp4" poster="/assets/poster3.jpg" playsinline preload="metadata"></video>
    </div>

  </div>
</section>

<section class="youtube-cta">
  <a href="https://youtube.com/@desaprenderparacreser?si=r9JIpxRR4Vvi7LTd" target="_blank" class="youtube-btn">
    <svg viewBox="0 0 24 24">
      <path d="M23.5 6.2a2.8 2.8 0 0 0-2-2C19.7 3.7 12 3.7 12 3.7s-6.7 0-8.9.6C1.8 3.9.8 4.9.5 6.2.1 8.4.1 12 .1 12s0 3.6.4 5.8c.3 1.3 1.3 2.3 2.6 2.6 2.2.6 8.9.6 8.9.6s6.7 0 8.9-.6c1.3-.3 2.3-1.3 2.6-2.6.4-2.2.4-5.8.4-5.8s0-3.6-.4-5.8zM9.5 15.5v-7l6 3.5-6 3.5z"/>
    </svg>
    Ver en YouTube
  </a>
</section>

<section class="bloque">
  <div class="wrap">
    <p>Aquí no se habla para tranquilizar.</p>
    <p>Pensar también es una forma de cuidado.</p>
  </div>
</section>

</body>
</html>
