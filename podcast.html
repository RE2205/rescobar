<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Desapre(he)nder para CreSer · Podcast</title>

<style>

:root{
  --negro:#0b0b0c;
  --negro-profundo:#050505;
  --blanco:#ffffff;
  --gris-suave:#5e5e5e;
  --azul:#6f8f9f;
  --linea:rgba(0,0,0,.08);
  --linea-oscura:rgba(255,255,255,.10);
  --yt:#FF0000;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
  line-height:1.6;
  background:var(--blanco);
  color:var(--negro-profundo);
}

.wrap{
  max-width:1100px;
  margin:0 auto;
  padding:0 32px;
}

/* ================= HERO ================= */

.hero{
  background:var(--blanco);
  padding:96px 0 48px;
}

.back-link{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:rgba(0,0,0,.55);
  text-decoration:none;
  margin-bottom:36px;
  transition:.25s ease;
}

.back-link::before{
  content:"←";
  font-size:12px;
  opacity:.6;
}

.back-link:hover{
  color:var(--azul);
}

.kicker{
  font-size:12px;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:rgba(0,0,0,.45);
  margin-bottom:22px;
}

h1{
  font-size:clamp(38px,5vw,60px);
  margin:0 0 18px;
  font-weight:600;
}

.hero p{
  max-width:640px;
  font-size:18px;
  color:var(--gris-suave);
  margin:0 0 28px;
}

/* ================= AXIOMA ================= */

.axioma{
  background:var(--negro-profundo);
  color:var(--blanco);
  padding:52px 0;
  text-align:center;
}

.axioma p{
  margin:0;
  font-size:clamp(18px,2vw,22px);
  letter-spacing:.36em;
  text-transform:uppercase;
  color:#8fb0c2;
  font-weight:500;
}

/* ================= CLIPS ================= */

.clips{
  background:var(--blanco);
  padding:90px 0 60px;
}

.clips-grid{
  display:flex;
  justify-content:center;
  gap:40px;
  flex-wrap:wrap;
}

.clip{
  position:relative;
  width:220px;
  aspect-ratio:9/16;
  border-radius:14px;
  overflow:hidden;
  background:#000;
  border:1px solid var(--linea);
  cursor:pointer;
}

.clip-poster{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  filter:grayscale(100%);
  transition:.35s ease;
  z-index:1;
}

.clip video{
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
}

.clip.playing video{
  opacity:1;
}

.clip.playing .clip-poster{
  opacity:0;
}

.play-btn{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:2;
}

.play-btn span{
  width:48px;
  height:48px;
  border-radius:50%;
  background:rgba(0,0,0,.65);
  border:1px solid rgba(255,255,255,.4);
  display:flex;
  align-items:center;
  justify-content:center;
}

.play-btn span::before{
  content:"";
  margin-left:3px;
  border-style:solid;
  border-width:8px 0 8px 12px;
  border-color:transparent transparent transparent #fff;
}

.clip.playing .play-btn{
  opacity:0;
}

/* ================= BOTÓN YOUTUBE ================= */

.youtube-cta{
  text-align:center;
  padding:50px 0 90px;
}

.youtube-btn{
  display:inline-flex;
  align-items:center;
  gap:12px;
  padding:14px 22px;
  border-radius:999px;
  background:var(--yt);
  color:#fff;
  font-size:14px;
  letter-spacing:.18em;
  text-transform:uppercase;
  text-decoration:none;
  transition:.25s ease;
}

.youtube-btn svg{
  width:18px;
  height:18px;
  fill:#fff;
}

.youtube-btn:hover{
  background:#cc0000;
  transform:translateY(-2px);
}

/* ================= BLOQUE FINAL ================= */

.bloque{
  background:var(--negro-profundo);
  color:var(--blanco);
  padding:80px 0;
  border-top:1px solid var(--linea-oscura);
}

.bloque p{
  max-width:720px;
  margin:0 0 28px;
  font-size:clamp(22px,2.4vw,28px);
  line-height:1.45;
  font-weight:500;
  letter-spacing:-0.01em;
  color:rgba(255,255,255,.92);
}

/* ================= RESPONSIVE ================= */

@media (max-width:768px){
  .clip{ width:200px; }
}

@media (max-width:500px){
  .clips-grid{
    flex-direction:column;
    align-items:center;
    gap:32px;
  }
}

</style>
</head>

<body>

<section class="hero">
  <div class="wrap">
    <a href="/" class="back-link">Volver al inicio</a>
    <div class="kicker">Podcast</div>
    <h1>Desapre(he)nder para CreSer</h1>
    <p>Conversaciones que cuestionan lo que creemos entender.</p>
  </div>
</section>

<section class="axioma">
  <div class="wrap">
    <p>No todo lo que duele es patología</p>
  </div>
</section>

<section class="clips">
  <div class="wrap clips-grid">

    <div class="clip" data-video="/assets/clip1.mp4">
      <div class="clip-poster" style="background-image:url('/assets/poster1.jpg')"></div>
      <div class="play-btn"><span></span></div>
      <video muted playsinline preload="none"></video>
    </div>

    <div class="clip" data-video="/assets/clip2.mp4">
      <div class="clip-poster" style="background-image:url('/assets/poster2.jpg')"></div>
      <div class="play-btn"><span></span></div>
      <video muted playsinline preload="none"></video>
    </div>

    <div class="clip" data-video="/assets/clip3.mp4">
      <div class="clip-poster" style="background-image:url('/assets/poster3.jpg')"></div>
      <div class="play-btn"><span></span></div>
      <video muted playsinline preload="none"></video>
    </div>

  </div>
</section>

<section class="youtube-cta">
  <a href="https://youtube.com/@desaprenderparacreser?si=r9JIpxRR4Vvi7LTd" target="_blank" class="youtube-btn">
    <svg viewBox="0 0 24 24">
      <path d="M23.5 6.2a2.8 2.8 0 0 0-2-2C19.7 3.7 12 3.7 12 3.7s-7.7 0-9.5.5a2.8 2.8 0 0 0-2 2A29 29 0 0 0 0 12a29 29 0 0 0 .5 5.8 2.8 2.8 0 0 0 2 2c1.8.5 9.5.5 9.5.5s7.7 0 9.5-.5a2.8 2.8 0 0 0 2-2A29 29 0 0 0 24 12a29 29 0 0 0-.5-5.8ZM9.7 15.5V8.5l6.3 3.5-6.3 3.5Z"/>
    </svg>
    Ver en YouTube
  </a>
</section>

<section class="bloque">
  <div class="wrap">
    <p>Aquí no se habla para tranquilizar.</p>
    <p>Pensar también es una forma de cuidado.</p>
  </div>
</section>

<script>
document.querySelectorAll('.clip').forEach(clip => {
  const video = clip.querySelector('video');
  const src = clip.dataset.video;

  clip.addEventListener('click', () => {

    if (clip.classList.contains('playing')) {
      video.pause();
      video.currentTime = 0;
      clip.classList.remove('playing');
      return;
    }

    document.querySelectorAll('.clip').forEach(other => {
      const otherVideo = other.querySelector('video');
      other.classList.remove('playing');
      otherVideo.pause();
      otherVideo.currentTime = 0;
    });

    if (!video.src) video.src = src;

    video.muted = false;
    video.play();
    clip.classList.add('playing');
  });
});
</script>

</body>
</html>
