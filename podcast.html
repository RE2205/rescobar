<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Desapre(he)nder para CreSer · Podcast</title>

<style>

:root{
  --negro:#0b0b0c;
  --blanco:#f6f6f2;
  --gris:#9a9a96;
  --azul:#6f8f9f;
  --linea:rgba(255,255,255,.10);
}

*{ box-sizing:border-box; }

body{
  margin:0;
  background:var(--negro);
  color:var(--blanco);
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
  line-height:1.6;
}

.wrap{
  max-width:1100px;
  margin:0 auto;
  padding:0 32px;
}

/* HERO */

.hero{
  padding:96px 0 40px;
}

.kicker{
  font-size:12px;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:rgba(255,255,255,.55);
  margin-bottom:20px;
}

h1{
  font-size:clamp(36px,5vw,54px);
  margin:0 0 16px;
}

.hero p{
  color:rgba(255,255,255,.72);
}

/* AXIOMA */

.axioma{
  padding:28px 0 32px;
  border-top:1px solid var(--linea);
  border-bottom:1px solid var(--linea);
  text-align:center;
}

.axioma p{
  font-size:14px;
  letter-spacing:.32em;
  text-transform:uppercase;
  color:var(--azul);
}

/* CLIPS */

.clips{
  padding:64px 0 80px;
}

.clips-grid{
  display:flex;
  justify-content:center;
  gap:32px;
  flex-wrap:wrap;
}

.clip{
  position:relative;
  width:280px;
  aspect-ratio:9/16;
  border-radius:18px;
  overflow:hidden;
  background:#000;
  border:1px solid var(--linea);
  cursor:pointer;
}

.clip-poster{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  filter:grayscale(100%);
  transition:.35s ease;
  z-index:1;
}

.clip video{
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
}

.clip.playing video{
  opacity:1;
}

.clip.playing .clip-poster{
  opacity:0;
}

.play-btn{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:2;
}

.play-btn span{
  width:60px;
  height:60px;
  border-radius:50%;
  background:rgba(0,0,0,.6);
  border:1px solid rgba(255,255,255,.4);
  display:flex;
  align-items:center;
  justify-content:center;
}

.play-btn span::before{
  content:"";
  margin-left:4px;
  border-style:solid;
  border-width:10px 0 10px 16px;
  border-color:transparent transparent transparent var(--blanco);
}

.clip.playing .play-btn{
  opacity:0;
}

.bloque{
  background:#000;
  padding:80px 0;
}

</style>
</head>

<body>

<section class="hero">
  <div class="wrap">
    <div class="kicker">Podcast</div>
    <h1>Desapre(he)nder para CreSer</h1>
    <p>Conversaciones para detener el ruido y pensar lo humano.</p>
  </div>
</section>

<section class="axioma">
  <div class="wrap">
    <p>No todo lo que duele es patología</p>
  </div>
</section>

<section class="clips">
  <div class="wrap clips-grid">

    <div class="clip" data-video="/assets/clip1.mp4">
      <div class="clip-poster" style="background-image:url('/assets/poster1.jpg')"></div>
      <div class="play-btn"><span></span></div>
      <video muted playsinline preload="none"></video>
    </div>

    <div class="clip" data-video="/assets/clip2.mp4">
      <div class="clip-poster" style="background-image:url('/assets/poster2.jpg')"></div>
      <div class="play-btn"><span></span></div>
      <video muted playsinline preload="none"></video>
    </div>

    <div class="clip" data-video="/assets/clip3.mp4">
      <div class="clip-poster" style="background-image:url('/assets/poster3.jpg')"></div>
      <div class="play-btn"><span></span></div>
      <video muted playsinline preload="none"></video>
    </div>

  </div>
</section>

<section class="bloque">
  <div class="wrap">
    <p>Aquí no se habla para tranquilizar.</p>
  </div>
</section>

<script>
document.querySelectorAll('.clip').forEach(clip => {
  const video = clip.querySelector('video');
  const src = clip.dataset.video;

  clip.addEventListener('click', () => {

    if (clip.classList.contains('playing')) {
      video.pause();
      video.currentTime = 0;
      clip.classList.remove('playing');
      return;
    }

    document.querySelectorAll('.clip').forEach(other => {
      const otherVideo = other.querySelector('video');
      other.classList.remove('playing');
      otherVideo.pause();
      otherVideo.currentTime = 0;
    });

    if (!video.src) video.src = src;

    video.muted = false;
    video.play();
    clip.classList.add('playing');
  });
});
</script>

</body>
</html>
