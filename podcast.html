<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Desapre(he)nder para CreSer · Podcast</title>

<style>

/* ==================================================
   DESAPRE(HE)NDER PARA CRESER
   Ajuste estratégico de atmósfera
   ================================================== */

:root{
  --negro:#0b0b0c;
  --blanco:#f6f6f2;
  --gris:#9a9a96;
  --azul:#6f8f9f;
  --linea:rgba(0,0,0,.08);
  --linea-oscura:rgba(255,255,255,.10);
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
  line-height:1.6;
  background:var(--blanco);
  color:var(--negro);
}

.wrap{
  max-width:1100px;
  margin:0 auto;
  padding:0 32px;
}

/* ================= HERO (BLANCO) ================= */

.hero{
  background:var(--blanco);
  padding:96px 0 40px;
}

.kicker{
  font-size:12px;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:rgba(0,0,0,.45);
  margin-bottom:20px;
}

h1{
  font-size:clamp(36px,5vw,54px);
  margin:0 0 16px;
  font-weight:500;
}

.hero p{
  max-width:600px;
  color:rgba(0,0,0,.65);
}

/* ================= AXIOMA (NEGRO) ================= */

.axioma{
  background:var(--negro);
  color:var(--blanco);
  padding:40px 0;
  text-align:center;
}

.axioma p{
  margin:0;
  font-size:15px;
  letter-spacing:.32em;
  text-transform:uppercase;
  color:var(--azul);
  font-weight:500;
}

/* ================= CLIPS (BLANCO) ================= */

.clips{
  background:var(--blanco);
  padding:72px 0 80px;
}

.clips-grid{
  display:flex;
  justify-content:center;
  gap:32px;
  flex-wrap:wrap;
}

.clip{
  position:relative;
  width:280px;
  aspect-ratio:9/16;
  border-radius:18px;
  overflow:hidden;
  background:#000;
  border:1px solid var(--linea);
  cursor:pointer;
}

/* Poster */

.clip-poster{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  filter:grayscale(100%);
  transition:.35s ease;
  z-index:1;
}

/* Video */

.clip video{
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
}

.clip.playing video{
  opacity:1;
}

.clip.playing .clip-poster{
  opacity:0;
}

/* Play */

.play-btn{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:2;
}

.play-btn span{
  width:60px;
  height:60px;
  border-radius:50%;
  background:rgba(0,0,0,.6);
  border:1px solid rgba(255,255,255,.4);
  display:flex;
  align-items:center;
  justify-content:center;
}

.play-btn span::before{
  content:"";
  margin-left:4px;
  border-style:solid;
  border-width:10px 0 10px 16px;
  border-color:transparent transparent transparent #fff;
}

.clip.playing .play-btn{
  opacity:0;
}

/* ================= BLOQUE FINAL (NEGRO) ================= */

.bloque{
  background:var(--negro);
  color:var(--blanco);
  padding:80px 0;
  border-top:1px solid var(--linea-oscura);
}

.bloque p{
  max-width:640px;
  margin:0 0 22px;
  color:rgba(255,255,255,.85);
}

/* ================= RESPONSIVE ================= */

@media (max-width:768px){
  .clip{ width:240px; }
}

@media (max-width:500px){
  .clips-grid{
    flex-direction:column;
    align-items:center;
  }
}

</style>
</head>

<body>

<!-- HERO BLANCO -->
<section class="hero">
  <div class="wrap">
    <div class="kicker">Podcast</div>
    <h1>Desapre(he)nder para CreSer</h1>
    <p>Conversaciones que cuestionan lo que creemos entender.</p>
  </div>
</section>

<!-- AXIOMA NEGRO -->
<section class="axioma">
  <div class="wrap">
    <p>No todo lo que duele es patología</p>
  </div>
</section>

<!-- CLIPS BLANCO -->
<section class="clips">
  <div class="wrap clips-grid">

    <div class="clip" data-video="/assets/clip1.mp4">
      <div class="clip-poster" style="background-image:url('/assets/poster1.jpg')"></div>
      <div class="play-btn"><span></span></div>
      <video muted playsinline preload="none"></video>
    </div>

    <div class="clip" data-video="/assets/clip2.mp4">
      <div class="clip-poster" style="background-image:url('/assets/poster2.jpg')"></div>
      <div class="play-btn"><span></span></div>
      <video muted playsinline preload="none"></video>
    </div>

    <div class="clip" data-video="/assets/clip3.mp4">
      <div class="clip-poster" style="background-image:url('/assets/poster3.jpg')"></div>
      <div class="play-btn"><span></span></div>
      <video muted playsinline preload="none"></video>
    </div>

  </div>
</section>

<!-- BLOQUE FINAL NEGRO -->
<section class="bloque">
  <div class="wrap">
    <p>Aquí no se habla para tranquilizar.</p>
    <p>Pensar también es una forma de cuidado.</p>
  </div>
</section>

<script>
document.querySelectorAll('.clip').forEach(clip => {
  const video = clip.querySelector('video');
  const src = clip.dataset.video;

  clip.addEventListener('click', () => {

    if (clip.classList.contains('playing')) {
      video.pause();
      video.currentTime = 0;
      clip.classList.remove('playing');
      return;
    }

    document.querySelectorAll('.clip').forEach(other => {
      const otherVideo = other.querySelector('video');
      other.classList.remove('playing');
      otherVideo.pause();
      otherVideo.currentTime = 0;
    });

    if (!video.src) video.src = src;

    video.muted = false;
    video.play();
    clip.classList.add('playing');
  });
});
</script>

</body>
</html>
