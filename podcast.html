<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Desapre(he)nder para CreSer · Podcast</title>
  <meta name="description" content="Conversaciones para detener el ruido y pensar lo humano sin prisa ni fórmulas." />

  <style>
    :root{
      --negro:#0b0b0c;
      --blanco:#f6f6f2;
      --gris:#9a9a96;
      --azul:#6f8f9f;
      --linea:rgba(255,255,255,.10);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      background:var(--negro);
      color:var(--blanco);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      line-height:1.6;
      -webkit-font-smoothing:antialiased;
    }

    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:0 32px;
    }

    /* HERO */

    .hero{ padding:120px 0 56px; }
    .kicker{
      font-size:13px;
      letter-spacing:.24em;
      text-transform:uppercase;
      color:rgba(255,255,255,.55);
      margin:0 0 28px;
    }
    h1{
      max-width:760px;
      font-size:clamp(38px,5vw,58px);
      font-weight:500;
      line-height:1.15;
      margin:0 0 22px;
    }
    .hero p{
      max-width:560px;
      font-size:18px;
      color:rgba(255,255,255,.75);
      margin:0;
    }

    /* AXIOMA */

    .axioma{
      padding:36px 0 48px;
      border-top:1px solid var(--linea);
      border-bottom:1px solid var(--linea);
      text-align:center;
    }
    .axioma p{
      margin:0;
      font-size:15px;
      letter-spacing:.28em;
      text-transform:uppercase;
      color:var(--azul);
    }

    /* CLIPS */

    .clips{ padding:72px 0 96px; }
    .clips-grid{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:20px;
    }

    .clip{
      position:relative;
      aspect-ratio:9/16;
      border-radius:16px;
      overflow:hidden;
      background:#000;
      border:1px solid var(--linea);
      cursor:pointer;
    }

    .clip video{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      filter:grayscale(100%);
      opacity:.85;
    }

    .clip.playing video{
      filter:none;
      opacity:1;
    }

    /* Poster overlay */
    .clip-poster{
      position:absolute;
      inset:0;
      background-size:cover;
      background-position:center;
      filter:grayscale(100%);
      transition:.3s ease;
    }

    .clip.playing .clip-poster{
      opacity:0;
      pointer-events:none;
    }

    /* Play editorial */
    .play-btn{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:3;
      transition:.3s ease;
    }

    .play-btn span{
      width:64px;
      height:64px;
      border-radius:50%;
      background:rgba(0,0,0,.6);
      border:1px solid rgba(255,255,255,.4);
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .play-btn span::before{
      content:"";
      margin-left:4px;
      border-style:solid;
      border-width:10px 0 10px 16px;
      border-color:transparent transparent transparent var(--blanco);
    }

    .clip.playing .play-btn{
      opacity:0;
      pointer-events:none;
    }

    .clip::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(
        to top,
        rgba(0,0,0,.65),
        rgba(0,0,0,.15) 45%,
        transparent
      );
      pointer-events:none;
    }

    .clip-info{
      position:absolute;
      bottom:14px;
      left:14px;
      right:14px;
      z-index:4;
    }

    .clip-info span{
      display:block;
      font-size:11px;
      letter-spacing:.22em;
      text-transform:uppercase;
      color:rgba(255,255,255,.55);
      margin-bottom:6px;
    }

    .clip-info p{
      margin:0;
      font-size:14px;
      line-height:1.4;
      font-weight:500;
    }

    /* RESPONSIVE */

    @media (max-width:1100px){
      .clips-grid{ grid-template-columns:repeat(3,1fr); }
    }
    @media (max-width:700px){
      .clips-grid{ grid-template-columns:repeat(2,1fr); }
    }
    @media (max-width:420px){
      .clips-grid{ grid-template-columns:1fr; }
    }
  </style>
</head>

<body>

<section class="hero">
  <div class="wrap">
    <p class="kicker">Podcast</p>
    <h1>Desapre(he)nder<br>para CreSer</h1>
    <p>Conversaciones para detener el ruido y pensar lo humano sin prisa ni fórmulas.</p>
  </div>
</section>

<section class="axioma">
  <div class="wrap">
    <p>No todo lo que duele es patología</p>
  </div>
</section>

<section class="clips">
  <div class="wrap clips-grid">

    <!-- CLIP 01 -->
    <div class="clip" data-video="/assets/clip1.mp4">
      <div class="clip-poster" style="background-image:url('/assets/poster1.jpg')"></div>
      <div class="play-btn"><span></span></div>
      <video muted playsinline preload="none"></video>
      <div class="clip-info"><span>Clip 01</span><p>Acerca del placer</p></div>
    </div>

    <!-- CLIP 02 -->
    <div class="clip" data-video="/assets/clip2.mp4">
      <div class="clip-poster" style="background-image:url('/assets/poster2.jpg')"></div>
      <div class="play-btn"><span></span></div>
      <video muted playsinline preload="none"></video>
      <div class="clip-info"><span>Clip 02</span><p>Vida y vacío</p></div>
    </div>

    <!-- CLIP 03 -->
    <div class="clip" data-video="/assets/clip3.mp4">
      <div class="clip-poster" style="background-image:url('/assets/poster3.jpg')"></div>
      <div class="play-btn"><span></span></div>
      <video muted playsinline preload="none"></video>
      <div class="clip-info"><span>Clip 03</span><p>Nacido y criado en Guatemala</p></div>
    </div>

    <!-- CLIP 04 -->
    <div class="clip" data-video="/assets/clip4.mp4">
      <div class="clip-poster" style="background-image:url('/assets/poster4.jpg')"></div>
      <div class="play-btn"><span></span></div>
      <video muted playsinline preload="none"></video>
      <div class="clip-info"><span>Clip 04</span><p>Neurodivergente</p></div>
    </div>

    <!-- CLIP 05 -->
    <div class="clip" data-video="/assets/clip5.mp4">
      <div class="clip-poster" style="background-image:url('/assets/poster5.jpg')"></div>
      <div class="play-btn"><span></span></div>
      <video muted playsinline preload="none"></video>
      <div class="clip-info"><span>Clip 05</span><p>Lo que toca</p></div>
    </div>

  </div>
</section>

<script>
  document.querySelectorAll(".clip").forEach(clip => {
    const video = clip.querySelector("video");
    const src = clip.dataset.video;

    clip.addEventListener("click", () => {
      if (!video.src) {
        video.src = src;
      }
      clip.classList.add("playing");
      video.muted = false;
      video.play();
    });
  });
</script>

</body>
</html>
