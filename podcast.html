<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Desapre(he)nder para CreSer · Podcast</title>
<meta name="description" content="Un podcast para desaprender lo automático y volver a escuchar lo humano." />

<style>
/* ---------- VARIABLES Y BASES (INVERTIDAS) ---------- */
:root {
  --negro: #0b0b0c;
  --blanco: #ffffff;
  --gris-claro: #f4f4f5;
  --gris-texto: #4a4a4a;
  --azul: #6f8f9f;
  --rojo-yt: #FF0000;
  --linea: rgba(0,0,0,.08);
  --wrap: 1100px;
  --pad: 28px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Inter", sans-serif;
  line-height: 1.6;
  color: var(--negro);
  background: var(--blanco);
  -webkit-font-smoothing: antialiased;
}

img, video { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; transition: color .3s; }

/* ---------- ESTRUCTURA ---------- */
.wrap {
  max-width: var(--wrap);
  margin: 0 auto;
  padding: 0 var(--pad);
}

/* ---------- NAV ---------- */
.topbar {
  position: absolute; /* Flota sobre el Hero */
  top: 0;
  width: 100%;
  z-index: 100;
}
.topbar .wrap {
  height: 80px;
  display: flex;
  align-items: center;
}
.back-link {
  font-size: 11px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: rgba(255,255,255,.7); /* Blanco tenue sobre la foto */
}
.back-link:hover { color: #fff; }

/* ---------- HERO IMPACTO (TU PORTADA) ---------- */
.hero {
  position: relative;
  min-height: 100vh; /* Pantalla completa */
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--blanco);
  background-color: var(--negro);
  /* Ruta actualizada a tu archivo de imagen */
  background-image: url('assets/miportada.jpeg'); 
  background-size: cover;
  background-position: center;
}

/* Transición suave hacia el contenido claro */
.hero-transition {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 25vh;
  background: linear-gradient(to top, var(--blanco), transparent);
  z-index: 10;
}

/* ---------- SECCIÓN AXIOMA (INVERTIDA - BLANCA) ---------- */
.axioma {
  padding: 120px 0;
  background: var(--blanco);
  text-align: center;
  position: relative;
  z-index: 20;
}
.quote {
  font-family: ui-serif, "Cormorant Garamond", serif;
  font-size: clamp(24px, 5vw, 32px);
  max-width: 32ch;
  margin: 0 auto;
  line-height: 1.3;
}
.quote span {
  display: block;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .3em;
  margin-top: 35px;
  color: var(--gris-texto);
}
.accent { color: var(--azul); }

/* ---------- GRILLA DE CLIPS ---------- */
.clips { padding: 100px 0; background: var(--gris-claro); }
.clips-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 40px;
}
.clip video {
  width: 100%;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.05);
  transition: transform 0.4s ease;
  background: #000;
}
.clip video:hover {
  transform: translateY(-8px);
  box-shadow: 0 15px 35px rgba(0,0,0,0.1);
}

/* ---------- YOUTUBE CTA ---------- */
.youtube-section { text-align: center; padding: 60px 0 100px; background: var(--gris-claro); }
.youtube-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--rojo-yt);
  color: #fff;
  padding: 14px 30px;
  border-radius: 100px;
  font-size: 13px;
  letter-spacing: .1em;
  text-transform: uppercase;
  font-weight: 600;
}
.youtube-btn:hover { filter: brightness(1.1); transform: scale(1.02); }
.youtube-btn svg { width: 18px; fill: currentColor; }

/* ---------- MANIFIESTO FINAL (INVERTIDO - BLANCO) ---------- */
.manifiesto {
  background: var(--blanco);
  padding: 130px 0;
  text-align: center;
  border-top: 1px solid var(--linea);
}
.lead {
  font-family: ui-serif, serif;
  font-size: clamp(24px, 5vw, 34px);
  max-width: 38ch;
  margin: 0 auto 30px;
  text-wrap: balance;
}
.lead em { font-style: normal; color: var(--azul); }
.fine { font-size: 14px; color: var(--gris-texto); letter-spacing: 0.05em; }
.fine b { color: var(--negro); text-transform: uppercase; font-size: 12px; }

/* ---------- FOOTER SOCIAL ---------- */
.footer { padding: 60px 0 100px; border-top: 1px solid var(--linea); background: var(--blanco); }
.social-images {
  display: flex;
  justify-content: center;
  gap: 35px;
}
.social-images img {
  width: 24px;
  height: 24px;
  opacity: 0.6;
  transition: opacity .3s, transform .3s;
}
.social-images a:hover img { opacity: 1; transform: translateY(-4px); }

</style>
</head>

<body>

<header class="topbar">
  <div class="wrap">
    <a class="back-link" href="/">← Volver al inicio</a>
  </div>
</header>

<main>

  <section class="hero" aria-label="Portada Desaprehender para CreSer">
    <div class="hero-transition"></div>
  </section>

  <section class="axioma">
    <div class="wrap">
      <p class="quote">
        No grabamos para convencer. Grabamos para <span class="accent">volver a escuchar</span>.
        <span>Cuando lo humano aparece, lo demás se ordena.</span>
      </p>
    </div>
  </section>

  <section class="clips" aria-label="Fragmentos del archivo vivo">
    <div class="wrap">
      <div class="clips-grid">
        <div class="clip">
          <video controls playsinline preload="metadata" poster="assets/poster1.jpg">
            <source src="assets/clip1.mp4" type="video/mp4">
          </video>
        </div>
        <div class="clip">
          <video controls playsinline preload="metadata" poster="assets/poster2.jpg">
            <source src="assets/clip2.mp4" type="video/mp4">
          </video>
        </div>
        <div class="clip">
          <video controls playsinline preload="metadata" poster="assets/poster3.jpg">
            <source src="assets/clip3.mp4" type="video/mp4">
          </video>
        </div>
      </div>
    </div>
  </section>

  <section class="youtube-section">
    <a href="https://youtube.com/@desaprenderparacreser" target="_blank" class="youtube-btn">
      <svg viewBox="0 0 24 24"><path d="M23.5 6.2c-.3-1.3-1.3-2.3-2.6-2.6C18.7 3 12 3 12 3s-6.7 0-8.9.6C1.8 3.9.8 4.9.5 6.2.1 8.4.1 12 .1 12s0 3.6.4 5.8c.3 1.3 1.3 2.3 2.6 2.6 2.2.6 8.9.6 8.9.6s6.7 0 8.9-.6c1.3-.3 2.3-1.3 2.6-2.6.4-2.2.4-5.8.4-5.8s0-3.6-.4-5.8zM9.5 15.5v-7l6 3.5-6 3.5z"/></svg>
      Ver en YouTube
    </a>
  </section>

  <section class="manifiesto">
    <div class="wrap">
      <p class="lead">
        Esto no es contenido.<br/>
        Es una práctica: <em>desaprender para volver a elegir</em>.
      </p>
      <p class="fine">
        Si te sirve, comparte. Si te incomoda, quédate un momento más.<br/>
        <b>Ahí empieza</b>.
      </p>
    </div>
  </section>

</main>

<footer class="footer">
  <div class="wrap">
    <div class="social-images">
      <a href="https://youtube.com/@desaprenderparacreser" target="_blank"><img src="assets/youtube.png" alt="YouTube"></a>
      <a href="https://www.instagram.com/desaprehender_para_creser" target="_blank"><img src="assets/instagram.png" alt="Instagram"></a>
      <a href="https://podcasts.apple.com/gt/podcast/desapre-he-nder-para-creser/id1714893342" target="_blank"><img src="assets/apple.png" alt="Apple Podcasts"></a>
      <a href="https://www.tiktok.com/@desaprendercreser" target="_blank"><img src="assets/tiktok.png" alt="TikTok"></a>
      <a href="https://open.spotify.com/show/..." target="_blank"><img src="assets/spotify.png" alt="Spotify"></a>
    </div>
  </div>
</footer>

</body>
</html>
