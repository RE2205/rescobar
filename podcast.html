<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Desapre(he)nder para CreSer · Podcast</title>

<style>
:root {
  --negro: #0b0b0c;
  --blanco: #ffffff;
  --gris-texto: #4a4a4a;
  --azul: #6f8f9f;
  --rojo-yt: #FF0000;
  --wrap: 1100px;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--blanco);
  color: var(--negro);
  -webkit-font-smoothing: antialiased;
}

/* ---------- HERO OPTIMIZADO PARA MOVIL ---------- */
.hero {
  position: relative;
  width: 100%;
  height: 100vh;
  background-color: var(--negro);
  background-image: url('assets/miportada.jpeg'); 
  background-repeat: no-repeat;
  background-position: center;
  background-size: cover; /* Desktop: llena la pantalla */
}

@media (max-width: 768px) {
  .hero {
    /* Móvil: muestra la imagen completa sin recortes */
    background-size: contain; 
    height: 60vh; /* Ajustamos la altura para que no sobre tanto espacio negro */
  }
}

.hero-transition {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 10vh;
  background: linear-gradient(to top, var(--blanco), transparent);
}

/* ---------- AXIOMA (BLANCO) ---------- */
.axioma {
  padding: 100px 20px;
  text-align: center;
  background: var(--blanco);
}
.quote {
  font-family: ui-serif, serif;
  font-size: clamp(20px, 5vw, 30px);
  max-width: 32ch;
  margin: 0 auto;
}

/* ---------- CLIPS (FONDO NEGRO) ---------- */
.clips { 
  padding: 80px 20px; 
  background: var(--negro); 
}
.clips-grid {
  max-width: var(--wrap);
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 30px;
}
.clip video {
  width: 100%;
  border-radius: 12px;
  background: #000;
}

/* ---------- YOUTUBE (FONDO NEGRO) ---------- */
.youtube-section { 
  text-align: center; 
  padding: 20px 0 80px; 
  background: var(--negro); 
}
.youtube-btn {
  display: inline-flex;
  align-items: center;
  background: var(--rojo-yt);
  color: #fff;
  padding: 12px 24px;
  border-radius: 100px;
  text-decoration: none;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
}

/* ---------- MANIFIESTO (BLANCO) ---------- */
.manifiesto {
  background: var(--blanco);
  padding: 100px 20px;
  text-align: center;
}

/* ---------- FOOTER (FONDO NEGRO) ---------- */
.footer { 
  padding: 60px 0 100px; 
  background: var(--negro); 
}
.social-images {
  display: flex;
  justify-content: center;
  gap: 30px;
}
.social-images img {
  width: 24px;
  filter: invert(1);
  opacity: 0.7;
}
</style>
</head>

<body>

  <section class="hero">
    <div class="hero-transition"></div>
  </section>

  <section class="axioma">
    <p class="quote">
      No grabamos para convencer.<br>Grabamos para <span style="color:var(--azul)">volver a escuchar</span>.
    </p>
  </section>

  <section class="clips">
    <div class="clips-grid">
      <div class="clip"><video controls src="assets/clip1.mp4"></video></div>
      <div class="clip"><video controls src="assets/clip2.mp4"></video></div>
      <div class="clip"><video controls src="assets/clip3.mp4"></video></div>
    </div>
  </section>

  <section class="youtube-section">
    <a href="#" class="youtube-btn">Ver en YouTube</a>
  </section>

  <section class="manifiesto">
    <p style="font-family:serif; font-size: 24px;">Desaprender para volver a elegir.</p>
  </section>

  <footer class="footer">
    <div class="social-images">
      <a href="#"><img src="assets/instagram.png" alt="IG"></a>
      <a href="#"><img src="assets/spotify.png" alt="SP"></a>
      <a href="#"><img src="assets/youtube.png" alt="YT"></a>
    </div>
  </footer>

</body>
</html>
