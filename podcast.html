<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desapre(he)nder para CreSer · Podcast</title>

<style>

:root{
  --negro:#0b0b0c;
  --negro-profundo:#050505;
  --blanco:#ffffff;
  --gris-suave:#5e5e5e;
  --azul:#6f8f9f;
  --linea:rgba(0,0,0,.08);
  --ring:rgba(246,246,242,.22);
  --ringHover:rgba(246,246,242,.5);
  --yt:#FF0000;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
  background:var(--blanco);
  color:var(--negro-profundo);
}

.wrap{
  max-width:1100px;
  margin:0 auto;
  padding:0 32px;
}

/* HERO */

.hero{
  padding:96px 0 48px;
}

.back-link{
  display:inline-block;
  font-size:11px;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:rgba(0,0,0,.55);
  text-decoration:none;
  margin-bottom:36px;
}

.back-link::before{
  content:"← ";
}

.back-link:hover{
  color:var(--azul);
}

.kicker{
  font-size:12px;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:rgba(0,0,0,.45);
  margin-bottom:22px;
}

h1{
  font-size:clamp(38px,5vw,60px);
  margin:0 0 18px;
  font-weight:600;
}

.hero p{
  max-width:640px;
  font-size:18px;
  color:var(--gris-suave);
}

/* AXIOMA */

.axioma{
  background:var(--negro-profundo);
  padding:52px 0;
  text-align:center;
}

.axioma p{
  margin:0;
  font-size:clamp(18px,2vw,22px);
  letter-spacing:.36em;
  text-transform:uppercase;
  color:#8fb0c2;
}

/* CLIPS */

.clips{
  padding:90px 0 60px;
}

.clips-grid{
  display:flex;
  justify-content:center;
  gap:40px;
  flex-wrap:wrap;
}

.clip{
  width:220px;
}

.clip video{
  width:100%;
  border-radius:14px;
  display:block;
}

/* YOUTUBE BUTTON */

.youtube-cta{
  text-align:center;
  padding:60px 0 70px;
}

.youtube-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:10px 18px;
  border-radius:999px;
  background:var(--yt);
  color:#fff;
  font-size:12px;
  letter-spacing:.16em;
  text-transform:uppercase;
  text-decoration:none;
  transition:.25s ease;
}

.youtube-btn svg{
  width:14px;
  height:14px;
  fill:#fff;
}

.youtube-btn:hover{
  background:#cc0000;
  transform:translateY(-2px);
}

/* BLOQUE FINAL */

.bloque{
  background:var(--negro-profundo);
  color:#ffffff;
  padding:80px 0 40px;
}

.bloque p{
  max-width:720px;
  margin:0 0 28px;
  font-size:clamp(22px,2.4vw,28px);
  line-height:1.45;
}

/* PLATAFORMAS INTEGRADAS */

.plataformas{
  background:var(--negro-profundo);
  padding:40px 0 80px;
}

.platforms{
  display:flex;
  justify-content:center;
  gap:22px;
}

.p-icon{
  width:50px;
  height:50px;
  border-radius:50%;
  border:1px solid var(--ring);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--blanco);
  text-decoration:none;
  transition:all .3s ease;
}

.p-icon svg{
  width:20px;
  height:20px;
  fill:currentColor;
  transition:transform .3s ease;
}

.p-icon:hover{
  border-color:var(--ringHover);
  transform:translateY(-2px);
}

.p-icon:hover svg{
  transform:scale(1.05);
}

/* RESPONSIVE */

@media (max-width:500px){
  .clips-grid{
    flex-direction:column;
    align-items:center;
  }

  .platforms{
    gap:18px;
  }
}

</style>
</head>

<body>

<section class="hero">
  <div class="wrap">
    <a href="/" class="back-link">Volver al inicio</a>
    <div class="kicker">Podcast</div>
    <h1>Desapre(he)nder para CreSer</h1>
    <p>Conversaciones que cuestionan lo que creemos entender.</p>
  </div>
</section>

<section class="axioma">
  <div class="wrap">
    <p>No todo lo que duele es patología</p>
  </div>
</section>

<section class="clips">
  <div class="wrap clips-grid">

    <div class="clip">
      <video src="/assets/clip1.mp4"
             poster="/assets/poster1.jpg"
             controls
             playsinline
             preload="metadata">
      </video>
    </div>

    <div class="clip">
      <video src="/assets/clip2.mp4"
             poster="/assets/poster2.jpg"
             controls
             playsinline
             preload="metadata">
      </video>
    </div>

    <div class="clip">
      <video src="/assets/clip3.mp4"
             poster="/assets/poster3.jpg"
             controls
             playsinline
             preload="metadata">
      </video>
    </div>

  </div>
</section>

<section class="youtube-cta">
  <a href="https://youtube.com/@desaprenderparacreser?si=r9JIpxRR4Vvi7LTd" target="_blank" class="youtube-btn">
    <svg viewBox="0 0 24 24">
      <path d="M23.5 6.2c-.3-1.3-1.3-2.3-2.6-2.6C19.7 3 12 3 12 3s-6.7 0-8.9.6C1.8 3.9.8 4.9.5 6.2.1 8.4.1 12 .1 12s0 3.6.4 5.8c.3 1.3 1.3 2.3 2.6 2.6 2.2.6 8.9.6 8.9.6s6.7 0 8.9-.6c1.3-.3 2.3-1.3 2.6-2.6.4-2.2.4-5.8.4-5.8s0-3.6-.4-5.8zM9.5 15.5v-7l6 3.5-6 3.5z"/>
    </svg>
    Ver en YouTube
  </a>
</section>

<section class="bloque">
  <div class="wrap">
    <p>Aquí no se habla para tranquilizar.</p>
    <p>Pensar también es una forma de cuidado.</p>
  </div>
</section>

<section class="plataformas">
  <div class="wrap">
    <div class="platforms">

      <a class="p-icon" href="#" aria-label="YouTube">
        <svg viewBox="0 0 24 24">
          <path d="M23.5 6.2a3.1 3.1 0 0 0-2.2-2.2C19.6 3.5 12 3.5 12 3.5s-7.6 0-9.3.5A3.1 3.1 0 0 0 .5 6.2 33 33 0 0 0 0 12c0 2 .2 4 .5 5.8a3.1 3.1 0 0 0 2.2 2.2c1.7.5 9.3.5 9.3.5s7.6 0 9.3-.5a3.1 3.1 0 0 0 2.2-2.2c.3-1.8.5-3.8.5-5.8s-.2-4-.5-5.8zM9.8 15.5v-7L16.2 12l-6.4 3.5z"/>
        </svg>
      </a>

      <a class="p-icon" href="#" aria-label="Instagram">
        <svg viewBox="0 0 24 24">
          <path d="M7.5 2.5h9A5 5 0 0 1 21.5 7.5v9a5 5 0 0 1-5 5h-9a5 5 0 0 1-5-5v-9a5 5 0 0 1 5-5z"/>
        </svg>
      </a>

      <a class="p-icon" href="#" aria-label="Apple Podcasts">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="2.2"/>
        </svg>
      </a>

      <a class="p-icon" href="#" aria-label="TikTok">
        <svg viewBox="0 0 24 24">
          <path d="M15.6 3h-2.3v12.1a3 3 0 1 1-2.6-3v-2.3a5.3 5.3 0 1 0 4.9 5.3V9.1a7 7 0 0 0 4.1 1.3V8.2a4.7 4.7 0 0 1-2.7-1.1A4.6 4.6 0 0 1 15.6 3z"/>
        </svg>
      </a>

      <a class="p-icon" href="#" aria-label="Spotify">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9.7"/>
        </svg>
      </a>

    </div>
  </div>
</section>

</body>
</html>
