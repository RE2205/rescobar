    /* =========================================
       ARTE Y VIDA
       Rick Rubin × Ronald Escobar
       ========================================= */

    :root{
      --negro:#0b0b0c;
      --blanco:#f5f5f2;
      --gris:#9a9a95;

      --rosa:#ff4ecd;
      --verde:#3dff9c;
      --azul:#4ddcff;
      --amarillo:#ffd23f;
      --violeta:rgba(120,80,255,.35);
    }

    *{ box-sizing:border-box; }

    html,body{
      margin:0;
      padding:0;
    }

    body{
      background:var(--negro);
      color:var(--blanco);
      font-family: system-ui, -apple-system, "Inter", Arial, sans-serif;
      line-height:1.6;
    }

    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:0 24px;
    }

    /* ================= HERO ================= */

    header{
      padding:120px 0 80px;
      position:relative;
      overflow:hidden;
      text-align:center;
    }

    header::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(600px 300px at 20% 20%, rgba(255,78,205,.22), transparent 60%),
        radial-gradient(600px 300px at 80% 30%, rgba(77,220,255,.22), transparent 60%),
        radial-gradient(600px 300px at 50% 80%, rgba(61,255,156,.18), transparent 60%);
      pointer-events:none;
    }

    h1{
      font-family: Georgia, "Times New Roman", serif;
      font-size:clamp(42px,6vw,86px);
      line-height:1.05;
      font-weight:400;
      margin:0;
    }

    .subrayado{
      position:relative;
      display:inline-block;
    }

    .subrayado::after{
      content:"";
      position:absolute;
      left:-6%;
      right:-6%;
      bottom:-14px;
      height:6px;
      background:linear-gradient(
        90deg,
        var(--rosa),
        var(--amarillo),
        var(--verde),
        var(--azul)
      );
      border-radius:4px;
      transform:rotate(-1.5deg);
    }

    /* ================= LA PILA ================= */

    .la-pila{
      padding:64px 0 8px;
    }

    .la-pila img{
      width:100%;
      max-width:720px;
      display:block;
      margin:0 auto;
      border-radius:12px;
      transform:rotate(-0.6deg);
      filter:contrast(1.05) saturate(1.15);
      box-shadow:
        0 20px 60px rgba(0,0,0,.45),
        0 0 0 1px rgba(255,255,255,.06);
    }

    /* ================= MANIFIESTO ================= */

      padding:24px 0 56px;
      text-align:center;
    }

    .manifiesto p{
      max-width:640px;
      font-size:18px;
      color:var(--gris);
      margin:0 auto 8px;
    }
