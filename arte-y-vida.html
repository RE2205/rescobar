<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Arte y vida — Logos Psyche</title>
  <meta name="description" content="Un encuadre clínico–creativo para artistas con bloqueo profundo." />
  <meta name="robots" content="noindex, nofollow" />

  <style>
    /* =====================================================
       ARTE Y VIDA — CSS INLINE
       Paleta de Salud Mental (Logos Psyche)
       ===================================================== */

    :root{
      --menta: #CFEDEA;
      --turquesa: #BFE6E2;
      --salvia: #DCE8D8;
      --marfil: #F6F4EF;
      --marfil-sombra: #EFECE4;
      --oro: #C6A357;
      --texto: #2F2F2F;
      --texto-suave: #5A5A55;
    }

    *,
    *::before,
    *::after{
      box-sizing: border-box;
    }

    html, body{
      margin: 0;
      padding: 0;
    }

    body{
      font-family: system-ui, -apple-system, "Inter", Arial, sans-serif;
      background:
        linear-gradient(
          180deg,
          var(--marfil) 0%,
          var(--marfil-sombra) 60%,
          #E6E1D6 100%
        );
      color: var(--texto);
      line-height: 1.6;
    }

    .wrap{
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ================= HERO ================= */

    .arte-vida-hero{
      background:
        linear-gradient(
          135deg,
          var(--turquesa) 0%,
          var(--salvia) 55%,
          var(--marfil) 100%
        );
      padding: 40px 0 32px;
      text-align: center;
    }

    .arte-vida-hero__inner{
      max-width: 760px;
      margin: 0 auto;
    }

    .arte-vida-hero__headline{
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(22px, 2.6vw, 34px);
      line-height: 1.3;
      font-weight: 400;
      color: var(--texto);
    }

    /* ============ BLOQUE IMAGEN + TEXTO ============ */

    .lp-espacio-creativo-split{
      background: rgba(255,255,255,0.35);
      padding: 56px 0 64px;
    }

    .lp-espacio-creativo-split__inner{
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 56px;
      align-items: flex-start;
      padding: 24px;
      border-radius: 16px;
      background: rgba(255,255,255,0.45);
    }

    .lp-espacio-creativo-split__media img{
      width: 100%;
      border-radius: 8px;
      filter: saturate(0.9) contrast(0.95);
    }

    .lp-espacio-creativo-split__text p{
      font-size: 16.5px;
      line-height: 1.75;
      color: var(--texto-suave);
      max-width: 46ch;
    }

    /* ================= BLOQUES ================= */

    section.block{
      padding: 56px 0;
    }

    .tag{
      display: inline-block;
      margin-bottom: 18px;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
      background: rgba(198,163,87,0.25);
      border: 1px solid rgba(198,163,87,0.45);
      color: #5A554C;
    }

    h2{
      font-family: Georgia, "Times New Roman", serif;
      font-size: 26px;
      margin-bottom: 18px;
    }

    h3{
      margin-top: 36px;
      font-size: 17px;
    }

    p{
      font-size: 16.5px;
      line-height: 1.75;
      color: var(--texto-suave);
      max-width: 50ch;
    }

    /* ================= CONTACTO ================= */

    .lp-espacio-creativo-contact{
      background: var(--marfil-sombra);
    }

    .lp-espacio-creativo-contact a{
      border-bottom: 1px solid var(--oro);
      color: var(--texto);
    }

    /* ================= FOOTER ================= */

    footer{
      padding: 28px 0;
      background: var(--marfil-sombra);
      text-align: center;
      font-size: 14px;
      color: var(--texto-suave);
    }

    /* ================= RESPONSIVE ================= */

    @media (max-width: 900px){
      .lp-espacio-creativo-split__inner{
        grid-template-columns: 1fr;
        gap: 40px;
      }
    }
  </style>
</head>

<body>

  <header class="arte-vida-hero">
    <div class="arte-vida-hero__inner">
      <h1 class="arte-vida-hero__headline">
        Si quieres trabajar en tu arte,<br>
        trabaja en tu vida.
      </h1>
    </div>
  </header>

  <section class="lp-espacio-creativo-split">
    <div class="wrap lp-espacio-creativo-split__inner">
      <div class="lp-espacio-creativo-split__media">
        <img src="assets/clinica1.png" alt="Espacio de consulta" />
      </div>
      <div class="lp-espacio-creativo-split__text">
        <p>Este no es un servicio tradicional...</p>
        <p>Es un encuadre clínico–creativo...</p>
        <p>Aquí no se busca forzar la obra...</p>
      </div>
    </div>
  </section>

  <!-- el resto del HTML sigue igual -->

</body>
</html>
