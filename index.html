<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ronald Escobar</title>
<meta name="description" content="Neurociencia, arte y humanidad.">

<style>
/* ==================================================
   HERO TERRITORIAL
   Ronald Escobar
   ================================================== */

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  height:100%;
  font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
  background:#0b0b0c;
  color:#f5f5f5;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:0 20px;
}

.hero-inner{
  max-width:900px;
}

/* TRÍADA */
.hero h1{
  font-size: clamp(28px, 5vw, 64px);
  font-weight:500;
  letter-spacing:0.08em;
  line-height:1.2;
}

/* NOMBRE */
.hero .name{
  margin-top:24px;
  font-size:14px;
  letter-spacing:0.2em;
  text-transform:uppercase;
  opacity:0.6;
}

/* RESPONSIVE */
@media (max-width:600px){
  .hero h1{
    letter-spacing:0.05em;
  }
}
</style>
</head>

<body>

<section class="hero">
  <div class="hero-inner">
    <h1>Neurociencia · Arte · Humanidad</h1>
    <div class="name">Ronald Escobar</div>
  </div>
</section>

</body>
</html>
